<!-- Иконка сайта. Рисунок 1:1 повторяет inline-иконку из <head> страниц
     (пурпурный квадрат со скруглением и монограммой GS), поэтому вид вкладки не меняется.
     Реальный файл, а не data:-URI, нужен, чтобы поисковые системы и соцсети
     могли скачать иконку: data:image/... они не забирают. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="14" fill="#864ea4"/>
    <text x="23" y="41" font-family="Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#ffffff">G</text>
    <text x="42" y="41" font-family="Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#ffffff">S</text>
</svg>
